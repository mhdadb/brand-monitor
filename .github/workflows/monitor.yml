name: Brand monitor

on:
  schedule:
    - cron: "30 5 * * *"   # every day 09:00 Tehran time
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write           # to save data/seen.json and data/mentions.csv

concurrency: monitor

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run monitor
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.main
      - name: Save results
        run: |
          git config user.name "brand-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Monitor results $(date -u +%F)"
          git push
